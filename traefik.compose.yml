services:
  traefik:
    environment:
      TRAEFIK_API_DASHBOARD: "true"
      TRAEFIK_API_INSECURE: "false"
    volumes:
      - ./dashboard.htpasswd:/etc/traefik/dashboard.htpasswd:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`${DASHBOARD_DOMAIN:?Укажите DASHBOARD_DOMAIN}`)"
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth
      traefik.http.middlewares.dashboard-auth.basicauth.usersfile: /etc/traefik/dashboard.htpasswd
      traefik.http.middlewares.dashboard-auth.basicauth.removeheader: "true"
